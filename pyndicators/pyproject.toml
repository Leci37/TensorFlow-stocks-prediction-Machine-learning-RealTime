[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyndicators"
version = "0.1.0"
description = "Indicadores técnicos para ML financiero en puro numpy + pandas: point-in-time, sin dependencias que compilar."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Luis Leciñana" }]
keywords = ["trading", "technical-analysis", "indicators", "quant", "machine-learning", "point-in-time", "pandas"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Investment",
]

# Núcleo: SOLO numpy + pandas. Instalación 100% limpia.
dependencies = [
    "numpy>=1.21",
    "pandas>=1.3",
]

[project.optional-dependencies]
# Solo para el puñado de indicadores DSP/Hilbert no viables en numpy puro.
talib = ["TA-Lib>=0.4"]
dev = ["pytest>=7", "ruff", "mypy"]
docs = ["mkdocs-material"]
all = ["pyndicators[talib]"]

[project.urls]
Homepage = "https://github.com/Leci37/pyndicators"
Repository = "https://github.com/Leci37/pyndicators"
Documentation = "https://github.com/Leci37/pyndicators/tree/main/docs"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pyndicators = ["data/*.csv", "py.typed"]

[tool.ruff]
line-length = 100
