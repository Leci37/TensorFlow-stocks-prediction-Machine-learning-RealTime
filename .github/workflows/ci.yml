name: ci
on: [push, pull_request]

permissions:
  contents: read

jobs:
  imports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Static: needs no dependencies installed, so it runs in seconds
      - run: python tools/check_imports.py
